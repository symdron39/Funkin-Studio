    <style>
/* ===== ./funkin-studio/css/base.css ===== */
/* 基本スタイル（レイアウト・フォーム・キャンバス・HUD の土台）。 */
:root {
  color-scheme: dark;
  --bg: #101217;
  --panel: #191d25;
  --line: #303744;
  --txt: #edf1f7;
  --muted: #9ba6b6;
  --accent: #57d6a0;
}
* {
  box-sizing: border-box;
}
body {
  margin: 0;
  background: var(--bg);
  color: var(--txt);
  font:
    14px system-ui,
    sans-serif;
}
header {
  padding: 14px;
  border-bottom: 1px solid var(--line);
  display: flex;
  gap: 12px;
  align-items: center;
  flex-wrap: wrap;
}
h1 {
  font-size: 18px;
  margin: 0;
}
small,
.tiny {
  color: var(--muted);
}
main {
  padding: 12px;
  display: grid;
  gap: 12px;
  grid-template-columns: minmax(0, 1.3fr) minmax(280px, 1fr);
}
.panel {
  background: var(--panel);
  border: 1px solid var(--line);
  border-radius: 12px;
  padding: 12px;
  min-width: 0;
}
h2 {
  font-size: 14px;
  color: var(--accent);
  margin: 0 0 10px;
}
label {
  display: block;
  color: var(--muted);
  font-size: 12px;
  margin: 8px 0 4px;
}
input,
select,
button {
  font: inherit;
  color: var(--txt);
  background: #252b36;
  border: 1px solid #414b5b;
  border-radius: 8px;
  padding: 9px;
  max-width: 100%;
}
input[type="file"] {
  width: 100%;
  font-size: 12px;
}
input[type="number"] {
  width: 100%;
}
button {
  cursor: pointer;
}
.primary {
  background: #174d3a;
  border-color: #287b5c;
}
.row {
  display: flex;
  gap: 8px;
  align-items: center;
  flex-wrap: wrap;
}
.row > * {
  flex: 1;
}
.row button {
  flex: 0 0 auto;
}
#stage {
  width: 100%;
  height: 42vh;
  min-height: 240px;
  background-color: #292d35;
  background-image:
    linear-gradient(45deg, #363b45 25%, transparent 25%),
    linear-gradient(-45deg, #363b45 25%, transparent 25%),
    linear-gradient(45deg, transparent 75%, #363b45 75%),
    linear-gradient(-45deg, transparent 75%, #363b45 75%);
  background-size: 20px 20px;
  background-position:
    0 0,
    0 10px,
    10px -10px,
    -10px 0;
  border-radius: 8px;
  display: block;
}
#status {
  font-size: 12px;
  color: var(--muted);
  white-space: pre-wrap;
  margin-top: 8px;
}
#timeline {
  width: 100%;
  accent-color: var(--accent);
}
.fields {
  display: grid;
  grid-template-columns: repeat(3, minmax(0, 1fr));
  gap: 8px;
}
#layers {
  max-height: 180px;
  overflow: auto;
  border: 1px solid var(--line);
  border-radius: 8px;
  padding: 5px;
}
.item {
  padding: 7px;
  border-radius: 6px;
  cursor: pointer;
  overflow-wrap: anywhere;
}
.item.active,
.item:hover {
  background: #214b3c;
}
.sprite-grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(105px, 1fr));
  gap: 8px;
  max-height: 300px;
  overflow: auto;
  margin: 8px 0;
}
.sprite-tile {
  display: flex;
  flex-direction: column;
  gap: 5px;
  align-items: center;
  min-width: 0;
  padding: 7px;
  border: 1px solid var(--line);
  border-radius: 8px;
  background: #222936;
  cursor: pointer;
  font-size: 11px;
  overflow-wrap: anywhere;
}
.sprite-tile.selected {
  border: 2px solid var(--accent);
  background: #244437;
}
.sprite-tile canvas {
  width: 88px;
  height: 88px;
  object-fit: contain;
  background: repeating-conic-gradient(#333 0 25%, #444 0 50%) 0/14px 14px;
}
.sprite-tile input {
  align-self: flex-start;
}
details summary {
  cursor: pointer;
  color: var(--muted);
  padding: 8px 0;
}
@media (max-width: 760px) {
  main {
    grid-template-columns: 1fr;
  }
}
#renderWelcome {
  position: fixed;
  inset: 0;
  background: rgba(8, 11, 17, 0.95);
  z-index: 9999;
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 18px;
  overflow: auto;
}
#renderWelcome[hidden] {
  display: none;
}
#renderWelcome .welcome-inner {
  max-width: 650px;
  width: 100%;
  background: #191d25;
  border: 1px solid #3d4b5c;
  border-radius: 16px;
  padding: 22px;
}
.render-choices {
  display: grid;
  grid-template-columns: repeat(2, minmax(0, 1fr));
  gap: 12px;
  margin-top: 15px;
}
.render-choice {
  text-align: left;
  min-height: 100px;
  display: flex;
  flex-direction: column;
  align-items: flex-start;
  justify-content: center;
  gap: 7px;
  padding: 14px;
}
.render-choice strong {
  font-size: 16px;
}
.render-choice small {
  font-size: 12px;
}
.render-choice[disabled] {
  opacity: 0.55;
  cursor: not-allowed;
}
@media (max-width: 520px) {
  .render-choices {
    grid-template-columns: 1fr;
  }
}
#sparrowWorkspace[hidden],
main[hidden] {
  display: none !important;
}
#sparrowWorkspace {
  padding: 12px;
  display: grid;
  grid-template-columns: minmax(0, 1.3fr) minmax(290px, 1fr);
  gap: 12px;
}
#spCanvas {
  width: 100%;
  height: 340px;
  touch-action: none;
  display: block;
  background: repeating-conic-gradient(#333943 0 25%, #252b33 0 50%) 0/20px 20px;
  border-radius: 8px;
}
.spTile {
  padding: 6px;
  border: 1px solid #46515f;
  border-radius: 8px;
  background: #252b36;
  cursor: pointer;
  min-width: 0;
  overflow-wrap: anywhere;
}
.spTile.active {
  border: 2px solid #57d6a0;
}
.spTile canvas {
  width: 100%;
  height: 80px;
  object-fit: contain;
}
.spTiles {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(110px, 1fr));
  gap: 8px;
  max-height: 320px;
  overflow: auto;
}
#langMenu {
  position: absolute;
  right: 12px;
  top: 57px;
  background: #252b36;
  padding: 8px;
  border: 1px solid #48515e;
  border-radius: 9px;
  z-index: 40;
}
#langMenu[hidden] {
  display: none;
}
@media (max-width: 760px) {
  #sparrowWorkspace {
    grid-template-columns: 1fr;
  }
}
#studioHud {
  position: fixed;
  top: 0;
  left: 0;
  right: 0;
  z-index: 500;
  background: rgba(19, 23, 30, 0.97);
  border-bottom: 1px solid var(--line);
  display: flex;
  align-items: center;
  gap: 8px;
  padding: 8px 12px;
  min-height: 60px;
  flex-wrap: nowrap;
}
body {
  padding-top: 65px;
}
#studioHud .hudLogo {
  display: flex;
  align-items: center;
  gap: 9px;
  min-width: 0;
  flex: 1;
}
#studioHud .hudLogo strong {
  font-size: 14px;
  white-space: nowrap;
}
#studioHud .hudLogo small {
  display: block;
  font-size: 10px;
}
#studioHud .hudActions {
  display: flex;
  gap: 5px;
  align-items: center;
  flex-shrink: 0;
}
#studioHud button {
  padding: 7px 9px;
  white-space: nowrap;
}
#hudUndo:disabled,
#hudRedo:disabled {
  opacity: 0.35;
  cursor: default;
}
#langMenu {
  position: fixed;
  right: 12px;
  top: 58px;
  display: flex;
  flex-direction: column;
  gap: 5px;
  z-index: 600;
}
#langMenu[hidden] {
  display: none;
}
#studioHud #changeRenderer {
  font-size: 11px;
  max-width: 170px;
  overflow: hidden;
  text-overflow: ellipsis;
}
@media (max-width: 520px) {
  #studioHud .hudLogo small {
    display: none;
  }
  #studioHud .hudLogo strong {
    font-size: 12px;
  }
  #studioHud {
    padding: 7px 6px;
    gap: 4px;
  }
  #studioHud button {
    padding: 7px 6px;
    font-size: 12px;
  }
  #studioHud #changeRenderer {
    max-width: 95px;
  }
}
#symCanvas {
  width: 100%;
  height: 420px;
  background: repeating-conic-gradient(#343a43 0 25%, #272d36 0 50%) 0/20px 20px;
  border-radius: 9px;
  display: block;
}
#symLayers {
  max-height: 350px;
  overflow: auto;
}

/* 各 State の root（<... data-state="id">）。StateManager が hidden を付け外しして切り替える */
[data-state][hidden] {
  display: none !important;
}

</style>

/* ===== ./funkin-studio/css/hud.css ===== */
/* ============================================================
   hud.css — 「全画面プレビュー + Hud パネル」の共通スタイル
   ------------------------------------------------------------
   Character Editor と、今後のステージエディタで共有する。
   使い方: ワークスペース要素に class="hudWorkspace" を付け、中に
     <canvas>（全画面）と <div class="hudLayer">（Hud を重ねる層）を置く。
   構造:
     .hudLayer      … canvas の上に重なる層。自身はクリックを通す（pointer-events: none）
     .hudBar        … 上のバー
     .hudDock       … 左右の縦並びドック（パネルが増えても縦にスクロールできる）
     .hudPanel      … 個々のパネル（半透明）
     .hudTransport  … 下の再生バー
     .hudEye        … 全 Hud の一括トグル。全部隠しても残る
   色はテーマ変数（--panel / --line / --txt / --accent）に従うので、カラーラボの変更にも追従する。
   ============================================================ */
.hudWorkspace {
  position: fixed;
  top: 61px; /* 上の共通 HUD（#studioHud）の高さ */
  left: 0;
  right: 0;
  bottom: 0;
  overflow: hidden;
}
.hudWorkspace[hidden] {
  display: none !important;
}
body:has(.hudWorkspace:not([hidden])) {
  overflow: hidden; /* 画面全体はスクロールさせない。動かすのはプレビューの中身 */
}
.hudWorkspace > canvas {
  position: absolute;
  inset: 0;
  width: 100%;
  height: 100%;
  display: block;
  touch-action: none;
  border: 0 !important;
  border-radius: 0 !important;
}

.hudLayer {
  position: absolute;
  inset: 0;
  pointer-events: none;
  --hud-bg: color-mix(in srgb, var(--panel) 86%, transparent);
}
.hudLayer > *,
.hudDock > * {
  pointer-events: auto;
}
.hudLayer[data-all-hidden="true"] [data-hud-panel],
.hudLayer[data-all-hidden="true"] .hudDock {
  display: none !important;
}
[data-hud-panel][hidden] {
  display: none !important;
}

.hudEye {
  position: absolute;
  top: 10px;
  left: 10px;
  width: 38px;
  height: 38px;
  padding: 0;
  border-radius: 10px;
  background: var(--hud-bg);
  backdrop-filter: blur(6px);
  z-index: 3;
}
.hudEye[aria-pressed="true"] {
  opacity: 0.55;
}

.hudBar {
  position: absolute;
  top: 10px;
  left: 58px;
  right: 10px;
  display: flex;
  align-items: center;
  gap: 6px;
  padding: 5px 8px;
  min-height: 38px;
  overflow-x: auto;
  white-space: nowrap;
  background: var(--hud-bg);
  border: 1px solid var(--line);
  border-radius: 10px;
  backdrop-filter: blur(6px);
  z-index: 2;
}
.hudBar > * {
  flex: 0 0 auto;
}
.hudBar button {
  padding: 5px 9px;
  border-radius: 8px;
}
.hudBar button.on,
.hudBar button[aria-pressed="true"] {
  background: var(--studio-important, #174d3a);
  border-color: var(--accent);
  color: #fff;
}
.hudBar input[type="number"] {
  width: 68px;
  padding: 5px 6px;
}
.hudSep {
  width: 1px;
  align-self: stretch;
  background: var(--line);
  margin: 2px 2px;
}
.hudCheck {
  display: flex;
  align-items: center;
  gap: 4px;
  margin: 0;
  font-size: 12px;
}
.hudCheck input {
  width: auto;
  padding: 0;
}
.hudReadout {
  font-size: 12px;
  color: var(--muted);
  font-variant-numeric: tabular-nums;
  padding-left: 4px;
}

.hudDock {
  position: absolute;
  top: 58px;
  display: flex;
  flex-direction: column;
  gap: 10px;
  width: min(340px, calc(100% - 20px));
  overflow-y: auto;
  overflow-x: hidden;
  pointer-events: none;
  scrollbar-width: thin;
}
.hudDockLeft {
  left: 10px;
  bottom: 118px; /* 再生バーの上まで */
}
.hudDockRight {
  right: 10px;
  bottom: 150px; /* 右下の「ローカル復元」「カラーテスト」と重ならないように */
}
.hudPanel {
  flex: 0 0 auto;
  background: var(--hud-bg);
  border: 1px solid var(--line);
  border-radius: 12px;
  padding: 12px;
  backdrop-filter: blur(6px);
  box-shadow: 0 6px 22px rgba(0, 0, 0, 0.22);
  min-width: 0;
}
.hudPanel h2 {
  margin-top: 0;
}
.hudPanel details > summary {
  padding: 6px 0;
}

.hudTransport {
  position: absolute;
  left: 10px;
  bottom: 10px;
  width: min(640px, calc(100% - 20px));
  padding: 8px 10px;
  background: var(--hud-bg);
  border: 1px solid var(--line);
  border-radius: 12px;
  backdrop-filter: blur(6px);
}
.hudTransport .row {
  gap: 6px;
}
.hudTransport .row > input[type="range"] {
  accent-color: var(--accent);
}
.hudTransport #offStatus,
.hudTransport .hudStatus {
  margin-top: 4px;
  font-size: 12px;
  max-height: 3.2em;
  overflow: auto;
}
.hudToast {
  position: absolute;
  left: 10px;
  bottom: 10px;
  max-width: min(560px, calc(100% - 20px));
  padding: 8px 12px;
  background: var(--hud-bg);
  border: 1px solid var(--line);
  border-radius: 10px;
  font-size: 12px;
  backdrop-filter: blur(6px);
}

/* ===== ./funkin-studio/css/theme-navy.css ===== */
/* Funkin' Studio | Navy Comfort Theme
   Customize the variables below. Loaded after the base/layout CSS. */
:root {
  color-scheme: dark;
  --bg: #002b66;
  --panel: #103b70;
  --line: #42638a;
  --txt: #e6edf7;
  --muted: #c3d4eb;
  --accent: #94c5dd;
  --studio-button: #183f70;
  --studio-button-hover: #285382;
  --studio-important: #994e3d;
  --studio-important-hover: #ad5e4a;
  --studio-important-shadow: #66352d;
  --studio-canvas: #d8dce2;
}
body { background: var(--bg); color: var(--txt); }
.panel { background: var(--panel); border-color: var(--line); box-shadow: 0 2px 8px rgba(0,15,43,.14); }
h1,h2,h3 { color: var(--txt); }
small,.tiny,label,#status,.studio-section-note { color: var(--muted); }
input,select,textarea,button { color: var(--txt); background: #173e70; border-color: #54749a; }
input::placeholder,textarea::placeholder { color: #b4c5da; }
button { background: var(--studio-button); color: #fff; transition: background-color .12s ease,border-color .12s ease; }
button:hover:not(:disabled) { background: var(--studio-button-hover); border-color: #a4c2dc; }
button:active:not(:disabled) { background: #123358; }
button:disabled { opacity: .52; cursor: not-allowed; }
button.primary,.primary,.studio-button { background: var(--studio-important); color: #fff; border-color: #8b4838; box-shadow: 0 1px 0 var(--studio-important-shadow); border-radius: 12px; font-weight: 700; }
button.primary:hover:not(:disabled),.primary:hover:not(:disabled),.studio-button:hover:not(:disabled) { background: var(--studio-important-hover); color: #fff; border-color: #c78070; }
button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible,summary:focus-visible { outline: 3px solid #a4d9f2; outline-offset: 2px; }
.item.active { background: #315d89; color: #fff; }
.item:hover { background: #29517f; color: #fff; }
.sprite-tile,.spTile { background: #173e70; border-color: var(--line); color: var(--txt); }
.sprite-tile.selected,.spTile.active { background: #315d89; border-color: #b3d9ec; }
.sprite-tile canvas { background: var(--studio-canvas); }
#studioHud { background: rgba(4,36,78,.98); border-color: var(--line); box-shadow: 0 2px 12px rgba(0,14,40,.2); }
#langMenu { background: var(--panel); border-color: var(--line); }
#studioHome,#funkinWelcome,#renderWelcome { background: #002b66; }
#studioHome .welcome-inner,#funkinWelcome .welcome-inner,#renderWelcome .welcome-inner { background: #103b70; border: 1px solid var(--line); border-radius: 20px; padding: clamp(20px,4vw,34px); box-shadow: 0 14px 34px rgba(0,14,42,.22); }
#studioHome .welcome-inner { max-width: 730px; }
#studioHome h1 { font-size: clamp(24px,4vw,32px); letter-spacing: -.025em; }
.render-choice { background: var(--studio-important); border: 1px solid #b77a6d; border-radius: 14px; min-height: 112px; gap: 9px; box-shadow: 0 1px 0 var(--studio-important-shadow); }
.render-choice:hover:not(:disabled) { background: var(--studio-important-hover); border-color: #e0a395; }
.render-choice strong { color: #fff; }
.render-choice small { color: #f4d9d1; }
.studio-files,.studio-display-options,.studio-inspector-group { background: #0c3466; border-color: var(--line); }
.studio-files > summary,.studio-display-options > summary,.studio-inspector-group > summary { background: #173e70; color: var(--txt); }
.studio-files[open] > summary,.studio-inspector-group[open] > summary { border-color: var(--line); }
.studio-canvas-wrap { background: var(--studio-canvas); border: 1px solid #7892ad; }
/* Canvas backgrounds affect preview only, not exported artwork. */
#stage,#spCanvas,#symCanvas,#offCanvas { background: var(--studio-canvas) !important; background-image: none !important; border: 1px solid #7892ad; }
#animateWorkspace,#sparrowWorkspace,#offsetWorkspace { gap: 16px; }
#layers { background: #0c3466; border-color: var(--line); }
#timeline { accent-color: #94c5dd; }
@media (max-width: 800px) {
  #animateWorkspace,#sparrowWorkspace,#offsetWorkspace { gap: 10px; }
  #studioHome .welcome-inner { max-height: 90dvh; overflow: auto; }
}
@media (max-width: 520px) {
  #studioHome,#funkinWelcome,#renderWelcome { padding: 12px; }
  #studioHome .welcome-inner,#funkinWelcome .welcome-inner,#renderWelcome .welcome-inner { padding: 20px; }
  .render-choice { min-height: 90px; }
  #studioHud button { min-height: 36px; }
}

/* ===== ./funkin-studio/css/contributors.css ===== */
#contributorsWelcome[hidden] { display: none !important; }

.contributors-list { display: grid; gap: 14px; margin-top: 20px; padding-bottom: 30px; }

.contributor-content { min-width: 0; overflow-wrap: anywhere; }

.contributor-content p { margin: 4px 0; }

.contributor-links { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 12px; }
.contributor-links a { padding: 7px 12px; border: 1px solid var(--line); border-radius: 8px; background: var(--studio-button, #183f70); color: var(--txt); text-decoration: none; }

@media (max-width: 480px) { .contributor-card img { width: 64px; height: 64px; } .contributor-card { gap: 10px; padding: 12px; } }

#otherWelcome[hidden], #contributorsWelcome[hidden],
#studioHud[hidden], #animateWorkspace[hidden],
#sparrowWorkspace[hidden], #offsetWorkspace[hidden] { display: none !important; }

body.editor-active #renderWelcome,

  // 選択中の要素の実体（ATLAS_SPRITE_instance か SYMBOL_Instance）を返す。無ければ undefined
  function legacySelectedInstance() {

  // プルダウンの選択を内部変数へ反映して、パネルを更新する
  $("legacyLayer").onchange = () => {

  $("legacyElement").onchange = () => {

    legacyEditRefresh();

  // 「適用」: 6つの数値欄を選択要素の行列に書き込む。DecomposedMatrix(分解済みの値)は行列と食い違うため削除する
  $("legacyApply").onclick = () => {

    legacyEditRefresh();

  };
  // 選択要素の位置(m30,m31)を設定して再描画。checkpoint=false はドラッグ中用（Undo用の保存はドラッグ開始時に1回だけ行う）
  function legacySetPosition(x, y, checkpoint = true) {
    const inst = legacySelectedInstance();
    if (!inst || !Number.isFinite(x) || !Number.isFinite(y)) return false;
    if (checkpoint) anCheckpoint();
    const m = inst.Matrix3D || (inst.Matrix3D = {});
    m.m30 = x;
    m.m31 = y;
    if (inst.DecomposedMatrix) delete inst.DecomposedMatrix;
    $("legacyM4").value = String(x);
    $("legacyM5").value = String(y);
    $("legacyPosX").value = String(x);
    $("legacyPosY").value = String(y);
    draw();
    return true;
  }
  $("legacyPositionApply").onclick = () => {
    if (legacySetPosition(Number($("legacyPosX").value), Number($("legacyPosY").value)))
      legacyNotice("選択要素の位置を変更しました。", "Selected element position updated.");
  };
  // 矢印ボタンで 1px ずつ移動
  for (const [id, dx, dy] of [
    ["legacyNudgeLeft", -1, 0],
    ["legacyNudgeRight", 1, 0],
    ["legacyNudgeUp", 0, -1],
    ["legacyNudgeDown", 0, 1],
  ]) {
    $(id).onclick = () => {
      const inst = legacySelectedInstance();
      if (!inst) return;
      const m = inst.Matrix3D || {};
      legacySetPosition((Number(m.m30) || 0) + dx, (Number(m.m31) || 0) + dy);
      legacyNotice("選択要素を移動しました。", "Selected element moved.");
    };
  }
  // Capture-phase pointer handling prevents the modern editor drag listener from
  // changing a different selected element when the legacy editor is active.
  // ドラッグ中の情報（開始座標・元の位置・拡大率）。null ならドラッグしていない
  let legacyDrag = null;
  $("stage").addEventListener(
    "pointerdown",
    (e) => {
      if (!isLegacyAnimate() || !legacySelectedInstance()) return;
      const inst = legacySelectedInstance(),
        m = inst.Matrix3D || {};
      legacyDrag = {
        id: e.pointerId,
        x: e.clientX,
        y: e.clientY,
        px: Number(m.m30) || 0,
        py: Number(m.m31) || 0,
        scale: stageScale() || 1,
      };
      anCheckpoint();
      $("stage").setPointerCapture(e.pointerId);
      e.preventDefault();
      e.stopImmediatePropagation();
    },
    true,
  );
  $("stage").addEventListener(
    "pointermove",
    (e) => {
      if (!legacyDrag || legacyDrag.id !== e.pointerId) return;
      legacySetPosition(
        legacyDrag.px + (e.clientX - legacyDrag.x) / legacyDrag.scale,
        legacyDrag.py + (e.clientY - legacyDrag.y) / legacyDrag.scale,
        false,
      );
      e.preventDefault();
      e.stopImmediatePropagation();
    },
    true,
  );
  // ドラッグ終了（指を離す / キャンセル）
  function legacyEndDrag(e) {
    if (!legacyDrag || legacyDrag.id !== e.pointerId) return;
    legacyDrag = null;
    legacyNotice(
      "ドラッグした位置を反映しました。JSONを保存してください。",
      "Drag position applied. Export the JSON to save.",
